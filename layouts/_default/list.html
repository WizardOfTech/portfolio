{{ define "main" }}
  <div class="page-content">
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "posts" }}
      <ul class="post-list">
        {{ range .Pages.ByDate.Reverse }}
          <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ if gt .Date.Year 1 }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>{{ end }}
          </li>
        {{ end }}
      </ul>
    {{ else }}
      {{ .Content }}
    {{ end }}
  </div>
{{ end }}
