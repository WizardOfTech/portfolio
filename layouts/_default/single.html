{{ define "main" -}}
<div class="post">
  <h1>{{ .Title }}</h1>
  <time class="post-date">
    Last updated: {{ now.Format "January 2, 2006" }}
  </time>
  {{ .Content }}
</div>

{{ if .Site.Config.Services.Disqus.Shortname -}}
<h2>Comments</h2>
{{ template "_internal/disqus.html" . }}
{{- end }}
{{- end }}
